server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /frontend/index.html =404;
    }

    location = /qa-front {
        return 301 /qa-front/;
    }

    location /qa-front/ {
        rewrite ^/qa-front/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
